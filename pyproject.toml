[tool.poetry]
name = "westfield-agent-ingest-python"
version = "0.1.0"
description = "Servicio de ingesta de Westfield: parsea docs, genera embeddings y publica bases vectoriales FAISS en S3 para el runtime multi-agente (HU-001)."
authors = ["Westfield Engineering <eng@westfield.example>"]
readme = "README.md"
packages = [{ include = "westfield_agent_ingest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.34.0"
faiss-cpu = "^1.8.0"
numpy = "^1.26.0"
httpx = "^0.27.0"
pydantic = "^2.7.0"
pypdf = "^4.2.0"
python-docx = "^1.1.0"
python-dotenv = "^1.0.0"
# >=0.16 requerido: typer 0.12 es incompatible con click >= 8.2 (rompe los
# flags booleanos --activate/--no-activate dentro de la imagen Docker).
typer = "^0.26.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
respx = "^0.21.1"
ruff = "^0.6.9"
black = "^24.8.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
ingest = "westfield_agent_ingest.cli:app"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer usa llamadas en defaults (typer.Option(...)) por diseño.
"src/westfield_agent_ingest/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
